[project]
name = "economic-warfare-osint"
version = "0.1.0"
description = "OSINT Agentic Workflow for Economic Warfare Exercise Support"
requires-python = ">=3.12"
dependencies = [
    # LLM / Agent
    "anthropic>=0.52.0",
    "mcp>=1.0.0",
    # Data models & config (pydantic floor bumped for swarm compat)
    "pydantic>=2.9.2",
    "python-dotenv>=1.0",
    # HTTP / API clients
    "httpx>=0.27.2",
    "aiohttp>=3.9",
    # Market data
    "yfinance>=0.2.40",
    # Data processing
    "pandas>=2.2.3",
    # Caching
    "diskcache>=5.6",
    # Output / reporting
    "jinja2>=3.1",
    "rich>=13.0",
    # Graph visualization
    "networkx>=3.3",
    # Web server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Corporate intelligence
    "sayari>=0.1.40",
    # Rate limiting (Redis-backed when REDIS_URL is set, in-memory fallback otherwise)
    "slowapi>=0.1.9",
    "redis>=5.2.0",
    "limits[redis]>=3.13.0",
    "cachetools>=7.1.1",
    # Redis Query Engine client (vector / hybrid search, semantic cache, agent memory).
    # Needs a real Redis 8 (FT.* commands) — Render Key Value runs Valkey and has NO
    # modules, so every caller must gate on redis_client.capabilities()["search"] and
    # degrade to the lexical path. MIT-licensed; the Voyage vectorizer is NOT installed
    # (we wrap our own httpx call in src/common/embeddings.py instead of the SDK).
    "redisvl>=0.8.0",
    # Notifications (Twilio SMS + SendGrid email)
    "twilio>=9.0.0",
    "sendgrid>=6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=6.0",
    "vcrpy>=6.0",
    "pytest-vcr>=1.0",
    "ruff>=0.4",
    "pre-commit>=4.6.0",
]
# Swarm-embed deps — install only when running the /api/wargame subapp.
# Gated at runtime by the WARGAME_ENABLED env var (see src/api.py).
# Install with: uv sync --extra wargame
wargame = [
    # Data layer
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    # Config / typing
    "pydantic-settings>=2.6.1",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    # AI
    "langgraph>=0.2.40",
    "langchain>=0.3.7",
    "langchain-anthropic>=0.2.4",
    "langchain-community>=0.3.5",
    # Data ingestion
    "pyarrow>=18.0.0",
    "dlt[postgres]>=1.3.0",
    "pyyaml>=6.0.2",
    "orjson>=3.10.11",
    # Utilities
    "python-multipart>=0.0.17",
    "slowapi>=0.1.9",
    # Test helpers swarm expects at runtime (fakeredis is imported defensively)
    "fakeredis>=2.26.0",
    "aiosqlite>=0.20.0",
    # AISStream.io — WebSocket client for global AIS firehose
    "websockets>=12",
]
# Semantic similarity (issue #30) — local, offline sentence-transformers
# embeddings for "find similar entities". OPTIONAL and heavy (pulls torch), so it
# is NOT a default dependency: the similarity feature falls back to a dependency-
# free lexical backend when this isn't installed. Enable the embedding backend by
# installing this extra AND setting SIMILARITY_BACKEND=embedding.
# Install with: uv sync --extra similarity
similarity = [
    "sentence-transformers>=3.0.0",
]
# Local LLM provider (issue #33) — the OpenAI SDK, used to talk to any
# OpenAI-compatible endpoint (Ollama / llama.cpp / vLLM) for a local/air-gapped
# deployment with a smaller model. Optional: only needed when LLM_PROVIDER=openai.
# Install with: uv sync --extra local
local = [
    "openai>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Needs a real Redis 8 (Query Engine / FT.*) and a live embedding key, so it
    # cannot run on the default hermetic config. Self-skips when they're absent:
    #   docker run -d -p 6399:6379 redis:8.2-alpine
    #   EMISSARY_TEST_REDIS_URL=redis://localhost:6399/0 VOYAGE_API_KEY=... \
    #     uv run pytest tests/integration -v
    "integration: requires a real Redis 8 + embeddings (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Exclude the swarm submodule — it has its own pyproject.toml + ruff config
# (select = ["E","F","I","N","UP","B","A","C4","SIM","PL","RUF"]) and its own
# lint lifecycle. Linting it from here applies the wrong rule set.
extend-exclude = ["swarm", "frontend", ".venv", "data"]

[tool.ruff.lint]
# Lock to the classic pyflakes + pycodestyle set so newer ruff versions don't
# silently introduce hundreds of new lint errors via expanded defaults. We
# specifically gate on real bugs (unused imports, undefined names, syntax
# issues) — not subjective style preferences (PL*, RUF*, etc.).
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-too-long — handled by ruff format, not enforced as error
]
