name: CI

# Runs on every PR targeting the deploy branches and on push to those branches
# (so the merge commit itself is also gated). Protect develop + emissary-v1 +
# master via branch protection rules in GitHub UI to require all jobs below
# to pass. develop is the local-staging branch; emissary-v1 is the prod
# auto-deploy branch on Render.
on:
  pull_request:
    branches: [develop, emissary-v1, master]
  push:
    branches: [develop, emissary-v1, master]

# Cancel superseded runs on the same PR — saves CI minutes when devs push
# rapid-fire fixups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  test:
    # Name pinned to the branch-protection required-check context; the Redis 8
    # integration runs inside this same job (see the service + steps below).
    name: Pytest (unit + e2e replay)
    runs-on: ubuntu-latest
    # A real Redis 8 (Query Engine + JSON) so the integration suite actually runs
    # here — vector entity search, agent-memory recall, and the shared analysis
    # store (F3). Without this the tests/integration/* tests self-skip and the
    # entire Redis-backed code path has no PR protection. Uses recorded fixture
    # vectors, so NO Voyage key is needed.
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6398:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip

      - name: Install project (dev extras)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the Redis service has the Query Engine
        # Fail loudly if the image ever ships without FT.*/JSON, rather than
        # letting the integration tests silently skip and hide a regression.
        # Uses redis-py (already installed) so no redis-cli/apt is needed.
        run: |
          python -c "
          import redis
          r = redis.Redis.from_url('redis://localhost:6398/0')
          r.execute_command('FT._LIST')
          r.execute_command('JSON.SET', '_probe', '\$', '{}'); r.delete('_probe')
          print('Redis 8 Query Engine + JSON: OK')
          "

      - name: Pytest
        # No secrets needed — VCR replay-only + recorded embedding fixtures;
        # ANTHROPIC_API_KEY cleared by tests/conftest.py. EMISSARY_TEST_REDIS_URL
        # activates the integration suite against the service above (port 6398,
        # matching the integration tests' convention). Coverage is informational.
        env:
          EMISSARY_TEST_REDIS_URL: redis://localhost:6398/0
        run: pytest tests/ --cov=src --cov-report=term --no-header

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-script:
    name: Render build.sh end-to-end
    runs-on: ubuntu-latest
    # Most expensive job (~3-5 min). Mirrors the Render runtime exactly so
    # we catch deploy-time failures (requirements.txt drift, frontend build)
    # BEFORE they hit prod.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (matches render.yaml)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Set up Node (matches render.yaml)
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"

      - name: Run build.sh
        run: bash build.sh

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits in the PR diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
