services:
  # ─── Emissary (main app, now with embedded wargame) ──────────────
  # Single web service runs Emissary + mounts the swarm backend as a
  # FastAPI subapp at /api/wargame (gated by WARGAME_ENABLED=1).
  - type: web
    name: economic-warfare-osint
    runtime: python
    region: virginia
    plan: standard  # 2 GB: starter's 512 MB OOM-crashed under the ~30-agent orchestrator fan-out
    branch: emissary-v1
    buildCommand: ./build.sh
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    # Persistent disk for the SQLite app DB (data/emissary.db) + disk cache.
    # Without this the filesystem is ephemeral and analyst data is lost on deploy.
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "20.11.0"
      - key: APP_ENV
        value: production
      # Prod must NOT reseed: seed_mock_data() is seed-only-if-empty, but keep
      # this 0 so production never loads demo COAs/briefings over real data.
      - key: EMISSARY_MOCK_DATA
        value: "0"
      # Pre-warm cache: replay a repeated question fast (demo-friendly), keyed by
      # query for 24h. Set "0" for production analysts who always need fresh runs.
      - key: EMISSARY_PREWARM_CACHE
        value: "1"
      # Semantic auto-replay: answer a REWORDED warmed question without asking, when
      # similarity is high AND the entity signature is identical. Default off — for
      # analysts, silently answering a near-miss is a liability, and the "Did you
      # mean…?" suggestion (always on) is the safe path. Set "1" ONLY on a demo
      # service where the magic-feel is wanted. Needs a Voyage key to do anything.
      - key: EMISSARY_SEMANTIC_REPLAY
        value: "0"
      # Analysis state backend. "memory" (default) is process-local — fine for the
      # single web instance we run today. Set "redis" to share live analysis
      # status/progress/results across instances and survive restarts (needs the
      # Redis 8 pserv below; closes fragility F3). Flip to "redis" before scaling
      # the web service past one instance.
      - key: ANALYSES_BACKEND
        value: "memory"
      - key: ANTHROPIC_API_KEY
        sync: false  # set manually in Render dashboard
      - key: FRED_API_KEY
        sync: false  # set manually in Render dashboard
      # ── Wargame embed activation ──
      - key: WARGAME_ENABLED
        value: "1"
      - key: AGENT_MODEL
        value: claude-sonnet-4-6
      - key: ARBITER_MODEL
        value: claude-opus-4-6
      - key: AGENT_RUNNER_IMPL
        value: langgraph
      # Wired from the managed resources below:
      - key: DATABASE_URL
        fromDatabase:
          name: swarm-db
          property: connectionString
      # Redis 8 (private service `emissary-redis` below). A pserv exposes host/port,
      # NOT a connectionString, and render.yaml can't interpolate strings — so we
      # feed the pieces to config._compose_redis_url(), which assembles REDIS_URL.
      # Everything downstream (rate limiter, wargame pub/sub, redisvl) still reads
      # REDIS_URL exactly as before.
      - key: REDIS_HOSTPORT
        fromService:
          type: pserv
          name: emissary-redis
          property: hostport
      - key: REDIS_PASSWORD
        fromService:
          type: pserv
          name: emissary-redis
          envVarKey: REDIS_PASSWORD
      # ── Notifications (Twilio SMS + SendGrid email) ──
      - key: NOTIFICATIONS_ENABLED
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: NEWSLETTER_FROM_EMAIL
        sync: false
      - key: NEWSLETTER_FROM_NAME
        value: "Emissary Weekly Brief"
      - key: SMS_DAILY_CAP_PER_USER
        value: "3"
      - key: NOTIFICATIONS_CRON_TOKEN
        generateValue: true
      - key: NOTIFICATIONS_ALLOWLIST
        sync: false
      - key: APP_BASE_URL
        sync: false  # set to the actual deployed URL (e.g. https://emissary.onrender.com)

  # ─── Weekly email digest cron (Mondays 12:00 UTC ≈ 7 AM ET) ──────
  - type: cron
    name: emissary-weekly-digest
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.10.1
    region: virginia
    schedule: "0 12 * * 1"  # Mondays at 12:00 UTC
    startCommand: >-
      curl --fail --silent --show-error
      -X POST
      -H "X-Cron-Token: $NOTIFICATIONS_CRON_TOKEN"
      "$APP_BASE_URL/api/notifications/send-weekly-digest"
    envVars:
      - key: NOTIFICATIONS_CRON_TOKEN
        fromService:
          type: web
          name: economic-warfare-osint
          envVarKey: NOTIFICATIONS_CRON_TOKEN
      - key: APP_BASE_URL
        fromService:
          type: web
          name: economic-warfare-osint
          envVarKey: APP_BASE_URL

  # ─── Redis 8 (private service) ───────────────────────────────────
  # Replaces the old `swarm-redis` KEY VALUE service, which was Valkey and had NO
  # modules — so no FT.* (Query Engine) and no JSON. This runs the stock upstream
  # `redis:8` image, which bundles the Query Engine + RedisJSON, unlocking the
  # semantic features (vector entity search, agent long-term memory, semantic
  # cache) while staying a strict protocol superset — the rate limiter and the
  # wargame pub/sub keep working unchanged.
  #
  # It's a superset AND cheaper: pserv starter is ~$7/mo vs the keyvalue's ~$10.
  #
  # ⚠️ AGPL/procurement: the redis:8 image is AGPLv3. Running it unmodified as a
  # network service creates no source-disclosure obligation (and Redis 8 is
  # tri-licensed, so RSALv2 is available), but some DoD/prime SBOM policies
  # blanket-ban AGPL artifacts. Confirm that's cleared before merging this.
  #
  # ⚠️ After the first sync, DELETE the old `swarm-redis` Key Value service in the
  # Render dashboard — removing it from the blueprint does not always auto-destroy
  # a managed datastore.
  - type: pserv
    name: emissary-redis
    runtime: image
    image:
      url: docker.io/library/redis:8.2-alpine  # PINNED — never :8 or :latest
    region: virginia
    plan: starter  # 512 MB RAM
    # Bind Render's assigned $PORT (its private-network router points at it), write
    # the AOF to the persistent disk (without --dir it lands on the ephemeral
    # container fs and is lost on restart), and cap memory below the plan ceiling.
    # volatile-lru (not noeviction/allkeys-lru): every key we write has an explicit
    # TTL, so under pressure it evicts expiring cache entries instead of erroring
    # writes on the rate-limiter path or dropping index docs we still consider live.
    dockerCommand: >-
      redis-server
      --port $PORT
      --dir /data
      --appendonly yes
      --appendfsync everysec
      --maxmemory 400mb
      --maxmemory-policy volatile-lru
      --requirepass $REDIS_PASSWORD
    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Generated once by Render, shared to the web service via fromService above.
      - key: REDIS_PASSWORD
        generateValue: true

# ─── Swarm Postgres (with pgvector for agent memory RAG) ───────────
# Extension must be enabled once via the Render shell:
#   psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
databases:
  - name: swarm-db
    region: virginia
    plan: basic-256mb  # cheapest tier that allows CREATE EXTENSION vector
    postgresMajorVersion: "16"
    # Internal-only. The live DB was found open to 0.0.0.0/0 in the Phase-2
    # audit — tighten it in the Render dashboard to match this.
    ipAllowList: []
